name: Refresh snapshot

# The update button. Actions -> "Refresh snapshot" -> "Run workflow" fetches a
# new posting sample, re-runs the analysis, rebuilds dashboard.html and the
# social card, and commits whatever moved. The site then picks it up with its
# own "Sync dashboards" button.
#
# Requires two repository secrets, added under Settings -> Secrets and
# variables -> Actions:
#   ADZUNA_APP_ID, ADZUNA_APP_KEY   free registration at developer.adzuna.com
#   JOOBLE_API_KEY                  optional, adds the second postings feed
#
# To make it automatic instead, add a `schedule:` block below — the fetch keys
# a snapshot by date and writes with INSERT OR REPLACE, so a repeat run on the
# same day replaces that day rather than double-counting it.
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Adzuna pages per market (lower = faster, thinner sample)"
        required: false
        default: "42"

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This study reuses the sibling study's classifiers rather than forking
      # them, so the two cannot silently diverge — src/delivery.py and
      # src/centres.py load orgtype.py, and src/population.py loads
      # taxonomy.py, both by file path, from a repository expected to sit
      # NEXT TO this one. On a runner nothing sits next to anything, which is
      # why the first run of this workflow died in the analysis step with
      # FileNotFoundError on gbs-agentic-shift/src/orgtype.py.
      #
      # Only code crosses the boundary. The postings store this study ranks on
      # is its own (data/gbs_postings.duckdb, restored below); the sibling's
      # duckdb is gitignored there and is not needed here.
      - name: Check out the sibling study whose classifiers this one reuses
        uses: actions/checkout@v4
        with:
          repository: morichtereur/gbs-agentic-shift
          path: _sibling

      # actions/checkout refuses to write outside the workspace, and the path
      # the code wants is the workspace's parent. So: check out inside, move up.
      - name: Put it where the code expects to find it
        run: |
          target="$(dirname "$GITHUB_WORKSPACE")/gbs-agentic-shift"
          mv _sibling "$target"
          test -f "$target/src/orgtype.py" && test -f "$target/src/taxonomy.py" \
            || { echo "::error::sibling checkout is missing orgtype.py or" \
                      "taxonomy.py — the analysis step cannot run without them"; \
                 exit 1; }
          echo "sibling study in place at $target"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The posting store is gitignored — it is 14 MB of binary that changes on
      # every run, which does not belong in the history. Carrying it in the
      # cache instead is what lets snapshots accumulate, so `trend` has a
      # previous run to compare against. A cold cache still produces a valid
      # single-snapshot dashboard; it just has nothing to compare to.
      - name: Restore the posting store
        uses: actions/cache/restore@v4
        with:
          path: data/gbs_postings.duckdb
          key: postings-${{ github.run_id }}
          restore-keys: postings-

      - name: Check the credentials are present
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ -z "$ADZUNA_APP_ID" ] || [ -z "$ADZUNA_APP_KEY" ]; then
            echo "::error::ADZUNA_APP_ID and ADZUNA_APP_KEY are not set. Add them" \
                 "under Settings -> Secrets and variables -> Actions." \
                 "Register free at developer.adzuna.com."
            exit 1
          fi

      # The sibling study supplies more than classifiers: its own posting sample
      # is what the classification-error correction is drawn from, and that
      # correction is what the "top-3 across reweightings" column reports. The
      # sample is gitignored in that repository, so a checkout does not carry
      # it, and src/population.py returns {} rather than raising when it is
      # missing — which means the build SUCCEEDS with the correction silently
      # switched off. Measured difference on the current snapshot: Poznań 1.4%
      # against 0.4%, Warsaw 0.3% against 0.03%. Those are the study's headline
      # robustness figures, understated by a factor of three to ten.
      #
      # A refresh that quietly publishes uncorrected figures is worse than a
      # refresh that does not run, so this stops here and says why.
      - name: Refuse to run without the sample the correction is drawn from
        run: |
          python - <<'EOF'
          import sys
          from src import config as C
          if C.POSTINGS_DB.exists():
              print(f"broad sample present at {C.POSTINGS_DB}")
              sys.exit(0)
          print(
              "::error::The sibling study's posting sample is not on this runner "
              f"({C.POSTINGS_DB}). It is gitignored in gbs-agentic-shift, so the "
              "checkout cannot carry it. Without it the contaminant shares are "
              "empty and the stability column is computed with no "
              "classification-error correction — the build would succeed and the "
              "figures would be wrong. Publish that duckdb as a release asset on "
              "gbs-agentic-shift and download it here, or run `make refresh` "
              "locally where both studies live."
          )
          sys.exit(1)
          EOF

      - name: Fetch a new snapshot
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          GBSLOC_MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: python -m src.gbs_fetch

      - name: Re-run the analysis and rebuild
        run: |
          python -m src.analyze
          python -m src.dashboard
          python -m src.og

      # Reported, not gated: with one snapshot in the store there is nothing to
      # compare against, and that is not a failure.
      - name: Direction since the last snapshot
        continue-on-error: true
        run: python -m src.trend

      - name: Save the posting store
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/gbs_postings.duckdb
          key: postings-${{ github.run_id }}

      # A build that produced a stub would otherwise be committed and published.
      - name: Check the dashboard actually built
        run: |
          size=$(wc -c < dashboard.html)
          echo "dashboard.html is $size bytes"
          if [ "$size" -lt 200000 ]; then
            echo "::error::dashboard.html is $size bytes, far below the ~350 kB" \
                 "a real build produces. Refusing to commit it."
            exit 1
          fi

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain dashboard.html RESULTS.md data)" ]; then
            echo "Nothing moved: the new snapshot produced the same figures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html RESULTS.md data
          git commit -m "Refresh snapshot: $(date -u +%Y-%m-%d)"
          git push
